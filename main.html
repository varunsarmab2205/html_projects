<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML DOCUMENT</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --card: #16161f;
            --surface: #111118;
            --border: #2a2a3a;
            --accent: #5b6ef5;
            --accent2: #e05a7a;
            --text: #e8e8f0;
            --muted: #7a7a95;
            --radius: 12px;
        }

        body {
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(91,110,245,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(224,90,122,0.07) 0%, transparent 60%);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.6rem;
            letter-spacing: 0.12em;
            margin-bottom: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        form {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            padding: 12px 16px;
            margin-bottom: 24px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91,110,245,0.15);
        }

        input::placeholder { color: #44445a; }

        button[type="submit"] {
            margin-top: 8px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: var(--radius);
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }

        button[type="submit"]:hover { opacity: 0.88; transform: translateY(-1px); }
        button[type="submit"]:active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <h1>LOGIN PAGE</h1>
    <form action="main.html" method="get">
        <label for="name">Enter Your Name</label>
        <input type="text" id="name" placeholder="Enter Your Name" minlength="3" required />
        <label for="email">Enter Your Email</label>
        <input type="email" id="email" placeholder="Enter Your Email" required />
        <label for="password">Enter Your Password</label>
        <input type="password" id="password" minlength="4" maxlength="8" required />
        <button type="submit">Submit</button>
    </form>
</body>
</html>
